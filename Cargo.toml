[package]
name = "linsparkle"
version = "0.2.0"
edition = "2024"
description = "Sparkle-style updates for Linux AppImages: the same appcasts and Ed25519 signatures as Sparkle and WinSparkle"
license = "MIT OR Apache-2.0"
repository = "https://github.com/medcelerate/LinSparkle"
readme = "README.md"
keywords = ["update", "sparkle", "appimage", "linux", "updater"]
categories = ["gui", "os::linux-apis"]

[dependencies]
# Loose on purpose: a library shouldn't force the app using it onto newer
# patch releases than it needs.
base64 = "0.23"
ed25519-dalek = "3"
flate2 = "1"
libc = "0.2"
png = "0.18"
roxmltree = "0.21"
serde_json = "1"
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }
tar = "0.4"
ureq = "3"

[features]
# The C API (linsparkle_* functions, include/linsparkle.h). Build the C
# libraries with scripts/build-c-libs.sh.
capi = []

# The C libraries (scripts/build-c-libs.sh) are built with this; an app that
# uses LinSparkle as a Rust crate builds it with its own profile instead.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# The C API catches no panics, and one crossing extern "C" aborts anyway.
panic = "abort"
