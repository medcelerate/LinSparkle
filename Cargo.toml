[package]
name = "linsparkle"
version = "0.1.0"
edition = "2024"
description = "Sparkle-style updates for Linux AppImages: the same appcasts and Ed25519 signatures as Sparkle and WinSparkle"
license = "MIT OR Apache-2.0"
repository = "https://github.com/medcelerate/LinSparkle"
readme = "README.md"
keywords = ["update", "sparkle", "appimage", "linux", "updater"]
categories = ["gui", "os::linux-apis"]

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
flate2 = "1.1.10"
png = "0.18.1"
roxmltree = "0.21.1"
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }
tar = "0.4.46"
ureq = "3.4.2"
